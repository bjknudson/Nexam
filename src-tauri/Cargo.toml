[package]
name = "nexam"
version = "0.14.0"
description = "Desktop-first local editor for .bok question banks"
authors = ["Nexam"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Printing sets the shared NSPrintInfo (paper size and margins) before handing
# the webview to the macOS print panel. Same versions wry already resolves, so
# this pulls in nothing new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
