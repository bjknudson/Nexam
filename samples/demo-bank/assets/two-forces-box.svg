<svg xmlns="http://www.w3.org/2000/svg" width="318" height="200" viewBox="0 0 318 200" data-nexam-topics="Forces; Net force; Newton's second law" data-nexam-preview="F1=60; F2=35; mass=5">
  <metadata id="nexam-variables">{"variables": [
  {"name":"F1","label":"Force to the right","units":"N","sample":"60"},
  {"name":"F2","label":"Force to the left","units":"N","sample":"35"},
  {"name":"mass","label":"Mass of the box","units":"kg","sample":"5"}
]}</metadata>
  <line x1="10" y1="130" x2="308" y2="130" stroke="#000000" stroke-width="2"/>
  <g data-nexam-stamp="Block" data-nexam-stamp-category="Mechanics" data-x="159" data-y="110" data-rotation="0" data-scale="1" data-origin-x="30" data-origin-y="20" data-width="60" data-height="40" transform="translate(159 110) translate(-30 -20)">
    <rect x="1" y="1" width="58" height="38" fill="#d9d9d9" stroke="#000000" stroke-width="1.5"/>
  </g>
  <text x="159" y="111" font-size="14" font-family="sans-serif" fill="#000000" text-anchor="middle">{{mass}} kg</text>
  <g data-nexam-control="variable-arrow" data-variable="F1" data-x="189" data-y="110" data-angle="0" data-angle-convention="ccw" data-scale="1.2" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-scale-group="Forces" data-max-length="110" data-min-length="8" data-label="$F_1$">
    <line x1="189" y1="110" x2="{{calc: 181.2 + max(8, min(110, 1.2 * F1))}}" y2="110"/>
    <polygon points="{{calc: 189 + max(8, min(110, 1.2 * F1))}},110 {{calc: 179.25 + max(8, min(110, 1.2 * F1))}},114.38 {{calc: 179.25 + max(8, min(110, 1.2 * F1))}},105.63" fill="#000000" stroke="none"/>
    <g data-nexam-clamp-mark="true" opacity="{{calc: min(1, 1000 * max(1.2 * F1 - max(8, min(110, 1.2 * F1)), max(8, min(110, 1.2 * F1)) - 1.2 * F1))}}" stroke="#000000" stroke-width="1.5" stroke-dasharray="none" fill="none">
      <line x1="{{calc: 184.5 + 0.5 * max(8, min(110, 1.2 * F1))}}" y1="105.67" x2="{{calc: 189.5 + 0.5 * max(8, min(110, 1.2 * F1))}}" y2="114.33"/>
      <line x1="{{calc: 188.5 + 0.5 * max(8, min(110, 1.2 * F1))}}" y1="105.67" x2="{{calc: 193.5 + 0.5 * max(8, min(110, 1.2 * F1))}}" y2="114.33"/>
    </g>
    <text x="{{calc: 195 + max(8, min(110, 1.2 * F1))}}" y="110" dy="0.35em" text-anchor="start" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" data-nexam-tex="$F_1$"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan></tspan></text>
  </g>
  <g data-nexam-control="variable-arrow" data-variable="F2" data-x="129" data-y="110" data-angle="180" data-angle-convention="ccw" data-scale="1.2" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-scale-group="Forces" data-max-length="110" data-min-length="8" data-label="$F_2$">
    <line x1="129" y1="110" x2="{{calc: 136.8 - max(8, min(110, 1.2 * F2))}}" y2="110"/>
    <polygon points="{{calc: 129 - max(8, min(110, 1.2 * F2))}},110 {{calc: 138.75 - max(8, min(110, 1.2 * F2))}},105.63 {{calc: 138.75 - max(8, min(110, 1.2 * F2))}},114.38" fill="#000000" stroke="none"/>
    <g data-nexam-clamp-mark="true" opacity="{{calc: min(1, 1000 * max(1.2 * F2 - max(8, min(110, 1.2 * F2)), max(8, min(110, 1.2 * F2)) - 1.2 * F2))}}" stroke="#000000" stroke-width="1.5" stroke-dasharray="none" fill="none">
      <line x1="{{calc: 133.5 - 0.5 * max(8, min(110, 1.2 * F2))}}" y1="114.33" x2="{{calc: 128.5 - 0.5 * max(8, min(110, 1.2 * F2))}}" y2="105.67"/>
      <line x1="{{calc: 129.5 - 0.5 * max(8, min(110, 1.2 * F2))}}" y1="114.33" x2="{{calc: 124.5 - 0.5 * max(8, min(110, 1.2 * F2))}}" y2="105.67"/>
    </g>
    <text x="{{calc: 123 - max(8, min(110, 1.2 * F2))}}" y="110" dy="0.35em" text-anchor="end" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" data-nexam-tex="$F_2$"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan></tspan></text>
  </g>
  <text x="159" y="158" font-size="14" font-family="sans-serif" fill="#000000" text-anchor="middle" data-nexam-tex="$F_1$ = {{F1}} N, $F_2$ = {{F2}} N"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%">1</tspan></tspan> = {{F1}} N, <tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%">2</tspan></tspan> = {{F2}} N</text>
  <text x="159" y="180" font-size="12" font-family="sans-serif" fill="#595959" text-anchor="middle">frictionless surface</text>
</svg>
