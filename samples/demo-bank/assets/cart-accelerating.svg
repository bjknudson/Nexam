    <line x1="112" y1="11" x2="120" y2="3" stroke="#000000" stroke-width="1"/>
  </g>
  <g data-nexam-stamp="Cart" data-nexam-stamp-category="Mechanics" data-x="110" data-y="115" data-rotation="0" data-scale="1" data-origin-x="40" data-origin-y="23" data-width="80" data-height="46" transform="translate(110 115) translate(-40 -23)">
    <rect x="2" y="4" width="76" height="28" rx="3" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
    <circle cx="20" cy="37" r="7" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    <circle cx="60" cy="37" r="7" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
