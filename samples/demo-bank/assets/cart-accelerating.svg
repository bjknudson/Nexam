    <circle cx="60" cy="37" r="1.5" fill="#000000"/>
  </g>
  <g data-nexam-control="variable-arrow" data-variable="a" data-x="160" data-y="80" data-angle="0" data-angle-convention="ccw" data-scale="20" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-label="a = {{a}} m/s²" data-label-at="mid">
    <line x1="160" y1="80" x2="{{calc: 152.2 + 20 * a}}" y2="80"/>
    <polygon points="{{calc: 160 + 20 * a}},80 {{calc: 150.25 + 20 * a}},84.38 {{calc: 150.25 + 20 * a}},75.63" fill="#000000" stroke="none"/>
    <text x="{{calc: 160 + 10 * a}}" y="65.6" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none">a = {{a}} m/s²</text>
  </g>
  <text x="110" y="40" font-size="14" font-family="sans-serif" fill="#000000" text-anchor="middle">starts at rest · t = {{t}} s</text>
</svg>
