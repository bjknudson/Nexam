<svg xmlns="http://www.w3.org/2000/svg" width="318" height="200" viewBox="0 0 318 200" data-nexam-topics="Kinematics; Acceleration" data-nexam-preview="a=2; t=3">
  <metadata id="nexam-variables">{"variables": [
  {"name":"a","label":"Acceleration","units":"m/s²","sample":"2"},
  {"name":"t","label":"Time","units":"s","sample":"3"}
]}</metadata>
  <g data-nexam-stamp="Ground" data-nexam-stamp-category="Mechanics" data-x="159" data-y="145" data-rotation="0" data-scale="2.4" data-origin-x="60" data-origin-y="6" data-width="120" data-height="12" transform="translate(159 145) scale(2.4) translate(-60 -6)">
    <line x1="0" y1="2" x2="120" y2="2" stroke="#000000" stroke-width="1.5"/>
    <line x1="2" y1="11" x2="10" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="12" y1="11" x2="20" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="22" y1="11" x2="30" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="32" y1="11" x2="40" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="42" y1="11" x2="50" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="52" y1="11" x2="60" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="62" y1="11" x2="70" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="72" y1="11" x2="80" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="82" y1="11" x2="90" y2="3" stroke="#000000" stroke-width="1"/>
