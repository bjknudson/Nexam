<svg xmlns="http://www.w3.org/2000/svg" width="318" height="200" viewBox="0 0 318 200" data-nexam-topics="Forces; Newton's third law" data-nexam-preview="weight=25">
  <metadata id="nexam-variables">{"variables": [
  {"name":"weight","label":"Weight of the book","units":"N","sample":"25"}
]}</metadata>
  <line x1="60" y1="120" x2="260" y2="120" stroke="#000000" stroke-width="3"/>
  <line x1="80" y1="120" x2="80" y2="185" stroke="#000000" stroke-width="3"/>
  <line x1="240" y1="120" x2="240" y2="185" stroke="#000000" stroke-width="3"/>
  <g data-nexam-stamp="Block" data-nexam-stamp-category="Mechanics" data-x="160" data-y="105" data-rotation="0" data-scale="0.75" data-origin-x="30" data-origin-y="20" data-width="60" data-height="40" transform="translate(160 105) scale(0.75) translate(-30 -20)">
    <rect x="1" y="1" width="58" height="38" fill="#d9d9d9" stroke="#000000" stroke-width="1.5"/>
  </g>
  <text x="160" y="106" font-size="12" font-family="sans-serif" fill="#000000" text-anchor="middle">book</text>
  <g data-nexam-control="variable-arrow" data-variable="weight" data-x="160" data-y="90" data-angle="90" data-angle-convention="ccw" data-scale="1.6" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-label="$F_N$ (table on book)" data-label-orient="horizontal">
    <line x1="160" y1="90" x2="160" y2="{{calc: 97.8 - 1.6 * weight}}"/>
    <polygon points="160,{{calc: 90 - 1.6 * weight}} 164.38,{{calc: 99.75 - 1.6 * weight}} 155.63,{{calc: 99.75 - 1.6 * weight}}" fill="#000000" stroke="none"/>
    <text x="160" y="{{calc: 75.6 - 1.6 * weight}}" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" data-nexam-tex="$F_N$ (table on book)"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">N</tspan></tspan></tspan> (table on book)</text>
  </g>
  <g data-nexam-control="variable-arrow" data-variable="weight" data-x="160" data-y="120" data-angle="270" data-angle-convention="ccw" data-scale="1.6" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-label="$F_g$ (Earth on book)">
    <line x1="160" y1="120" x2="160" y2="{{calc: 112.2 + 1.6 * weight}}"/>
    <polygon points="160,{{calc: 120 + 1.6 * weight}} 155.63,{{calc: 110.25 + 1.6 * weight}} 164.38,{{calc: 110.25 + 1.6 * weight}}" fill="#000000" stroke="none"/>
    <text x="160" y="{{calc: 134.4 + 1.6 * weight}}" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" data-nexam-tex="$F_g$ (Earth on book)"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">g</tspan></tspan></tspan> (Earth on book)</text>
  </g>
</svg>
