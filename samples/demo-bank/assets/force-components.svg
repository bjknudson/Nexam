<svg xmlns="http://www.w3.org/2000/svg" width="318" height="200" viewBox="0 0 318 200" data-nexam-topics="Forces; Vectors; Components" data-nexam-preview="force=50; angle=37">
  <metadata id="nexam-variables">{"variables": [
  {"name":"force","label":"Force","units":"N","sample":"50"},
  {"name":"angle","label":"Angle above the horizontal","units":"°","sample":"37"},
  {"name":"Fx","units":"N","formula":"force * cos(angle)","show":{"kind":"decimals","places":1}},
  {"name":"Fy","units":"N","formula":"force * sin(angle)","show":{"kind":"decimals","places":1}}
]}</metadata>
  <line x1="40" y1="160" x2="300" y2="160" stroke="#808080" stroke-width="1"/>
  <line x1="70" y1="190" x2="70" y2="20" stroke="#808080" stroke-width="1"/>
  <g data-nexam-control="variable-arrow" data-variable="Fx" data-x="70" data-y="160" data-angle="0" data-angle-convention="ccw" data-scale="2.4" data-heads="end" fill="none" stroke="#595959" stroke-width="1.5" data-scale-group="Force" stroke-dasharray="6 4.5" data-label="$F_x$" data-label-side="below">
    <line x1="70" y1="160" x2="{{calc: 62.2 + 2.4 * Fx}}" y2="160"/>
    <polygon points="{{calc: 70 + 2.4 * Fx}},160 {{calc: 60.25 + 2.4 * Fx}},164.38 {{calc: 60.25 + 2.4 * Fx}},155.63" fill="#595959" stroke="none"/>
    <text x="{{calc: 76 + 2.4 * Fx}}" y="160" dy="0.35em" text-anchor="start" font-size="14" font-family="sans-serif" fill="#595959" stroke="none" data-nexam-tex="$F_x$"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">x</tspan></tspan></tspan></text>
  </g>
  <g data-nexam-control="variable-arrow" data-variable="Fy" data-x="70" data-y="160" data-angle="90" data-angle-convention="ccw" data-scale="2.4" data-heads="end" fill="none" stroke="#595959" stroke-width="1.5" data-scale-group="Force" stroke-dasharray="6 4.5" data-label="$F_y$" data-label-at="mid">
    <line x1="70" y1="160" x2="70" y2="{{calc: 167.8 - 2.4 * Fy}}"/>
    <polygon points="70,{{calc: 160 - 2.4 * Fy}} 74.38,{{calc: 169.75 - 2.4 * Fy}} 65.63,{{calc: 169.75 - 2.4 * Fy}}" fill="#595959" stroke="none"/>
    <text x="64" y="{{calc: 160 - 1.2 * Fy}}" dy="0.35em" text-anchor="end" font-size="14" font-family="sans-serif" fill="#595959" stroke="none" data-nexam-tex="$F_y$"><tspan font-family="'STIX Two Math', 'Cambria Math', 'Times New Roman', serif"><tspan font-style="italic">F</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">y</tspan></tspan></tspan></text>
  </g>
  <g data-nexam-control="variable-arrow" data-variable="force" data-x="70" data-y="160" data-angle="0" data-angle-convention="ccw" data-scale="2.4" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-scale-group="Force" data-angle-variable="angle" data-label="F = {{force}} N">
    <g transform="rotate({{calc: -angle}} 70 160)">
      <line x1="70" y1="160" x2="{{calc: 62.2 + 2.4 * force}}" y2="160"/>
      <polygon points="{{calc: 70 + 2.4 * force}},160 {{calc: 60.25 + 2.4 * force}},164.38 {{calc: 60.25 + 2.4 * force}},155.63" fill="#000000" stroke="none"/>
      <text x="{{calc: 76 + 2.4 * force}}" y="160" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" transform="rotate({{angle}} {{calc: 76 + 2.4 * force}} 160)">F = {{force}} N</text>
    </g>
  </g>
  <g data-nexam-control="variable-arc" data-variable="angle" data-x="70" data-y="160" data-rotation="0" data-radius="34" data-heads="none" data-angle-convention="ccw" fill="none" stroke="#000000" stroke-width="1.5" data-label="θ = {{angle}}°" data-label-side="outside" data-label-gap="14">
    <g transform="rotate({{calc: -(0 + min(angle, 0))}} 70 160)">
      <circle cx="70" cy="160" r="34" fill="none" stroke-dasharray="{{calc: 0.5934 * max(angle, -angle)}} 213.63" transform="translate(0 320) scale(1 -1)"/>
    </g>
    <g transform="rotate({{calc: -(0 + angle / 2)}} 70 160)">
      <text x="126.4" y="160" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none" transform="rotate({{calc: 0 + angle / 2}} 126.4 160)">θ = {{angle}}°</text>
    </g>
  </g>
</svg>
