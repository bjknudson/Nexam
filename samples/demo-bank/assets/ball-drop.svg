<svg xmlns="http://www.w3.org/2000/svg" width="318" height="200" viewBox="0 0 318 200" data-nexam-topics="Kinematics; Free fall" data-nexam-preview="t=2.5; g=9.8">
  <metadata id="nexam-variables">{"variables": [
  {"name":"t","label":"Time falling","units":"s","sample":"2.5"},
  {"name":"g","label":"Gravitational acceleration","units":"m/s²","sample":"9.8"},
  {"name":"v","units":"m/s","formula":"g * t","show":{"kind":"sig","places":2}}
]}</metadata>
  <g data-nexam-stamp="Ground" data-nexam-stamp-category="Mechanics" data-x="159" data-y="186" data-rotation="0" data-scale="2.4" data-origin-x="60" data-origin-y="6" data-width="120" data-height="12" transform="translate(159 186) scale(2.4) translate(-60 -6)">
    <line x1="0" y1="2" x2="120" y2="2" stroke="#000000" stroke-width="1.5"/>
    <line x1="2" y1="11" x2="10" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="12" y1="11" x2="20" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="22" y1="11" x2="30" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="32" y1="11" x2="40" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="42" y1="11" x2="50" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="52" y1="11" x2="60" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="62" y1="11" x2="70" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="72" y1="11" x2="80" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="82" y1="11" x2="90" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="92" y1="11" x2="100" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="102" y1="11" x2="110" y2="3" stroke="#000000" stroke-width="1"/>
    <line x1="112" y1="11" x2="120" y2="3" stroke="#000000" stroke-width="1"/>
  </g>
  <circle cx="110" cy="40" r="10" fill="#a6a6a6" stroke="#000000" stroke-width="1.5"/>
  <line x1="110" y1="52" x2="110" y2="178" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4.5"/>
  <text x="118" y="30" font-size="12" font-family="sans-serif" fill="#000000">released from rest</text>
  <g data-nexam-control="variable-arrow" data-variable="v" data-x="220" data-y="40" data-angle="270" data-angle-convention="ccw" data-scale="4" data-heads="end" fill="none" stroke="#000000" stroke-width="1.5" data-max-length="135" data-label="v after {{t}} s" data-label-at="end">
    <line x1="220" y1="40" x2="220" y2="{{calc: 32.2 + min(135, 4 * v)}}"/>
    <polygon points="220,{{calc: 40 + min(135, 4 * v)}} 215.63,{{calc: 30.25 + min(135, 4 * v)}} 224.38,{{calc: 30.25 + min(135, 4 * v)}}" fill="#000000" stroke="none"/>
    <g data-nexam-clamp-mark="true" opacity="{{calc: min(1, 1000 * max(4 * v - min(135, 4 * v), min(135, 4 * v) - 4 * v))}}" stroke="#000000" stroke-width="1.5" stroke-dasharray="none" fill="none">
      <line x1="224.33" y1="{{calc: 35.5 + 0.5 * min(135, 4 * v)}}" x2="215.67" y2="{{calc: 40.5 + 0.5 * min(135, 4 * v)}}"/>
      <line x1="224.33" y1="{{calc: 39.5 + 0.5 * min(135, 4 * v)}}" x2="215.67" y2="{{calc: 44.5 + 0.5 * min(135, 4 * v)}}"/>
    </g>
    <text x="220" y="{{calc: 54.4 + min(135, 4 * v)}}" dy="0.35em" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#000000" stroke="none">v after {{t}} s</text>
  </g>
  <text x="30" y="115" font-size="14" font-family="sans-serif" fill="#000000">d = ?</text>
</svg>
